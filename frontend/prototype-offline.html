<script>
const USERS={'admin@novair.com':'Admin','staff@novair.com':'Staff','citizen@novair.com':'Citizen'};let role='';
const RULES=[/.{8,}/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/];

function fill(u){em.value=u+'@novair.com';pw.value='NOVAIR@2026';chk();er.textContent=''}
function login(){try{const e=em.value.trim().toLowerCase();if(!chk())return er.textContent='Password does not meet the requirements.';
if(!USERS[e]||pw.value!=='NOVAIR@2026')return er.textContent='Incorrect email or password.';role=USERS[e];login_.style.display='none';app.style.display='flex';nav_();go(ALLOW[role][0])}catch(x){er.textContent='Error: '+x.message}}
const login_=document.getElementById('login');
// ---- sample data (SIMULATED) : name,pop(lakh),density,beds,ambulances,police,fire,rescue,shelterCap,gx,gy
const RAW=[['Jaipur',66,598,9000,120,400,40,12,20000,3,1],['Jodhpur',37,161,4500,70,260,24,8,12000,1,1],['Udaipur',31,262,3200,55,200,18,7,15000,2,3],['Kota',20,230,3800,60,190,20,6,9000,3,3],['Bikaner',24,78,2600,45,170,15,5,8000,1,0],['Ajmer',26,305,3000,50,180,16,6,10000,2,2],['Jaisalmer',7,17,700,18,90,6,3,3000,0,1],['Barmer',26,92,1500,30,120,8,4,6000,0,2],['Alwar',37,438,2700,48,210,14,5,9000,4,1],['Bharatpur',26,503,2200,40,150,12,5,8000,4,2],['Sikar',27,282,1800,35,140,10,4,7000,3,0],['Chittorgarh',15,198,1300,28,110,8,4,5000,2,4]];
const D=RAW.map(r=>({n:r[0],pop:r[1],den:r[2],beds:r[3],amb:r[4],pol:r[5],fire:r[6],resc:r[7],shel:r[8],x:r[9],y:r[10],risk:'Low',inc:null,pr:null,occ:.35,out:{}}));
const AREAS={Jaipur:['Malviya Nagar','Mansarovar','Vaishali Nagar','C-Scheme','Sanganer','Jhotwara'],Jodhpur:['Sardarpura','Ratanada','Paota','Mandore'],Udaipur:['Fateh Sagar','Hiran Magri','Sukhadia Circle'],Kota:['Talwandi','Vigyan Nagar','Mahaveer Nagar'],Bikaner:['Lalgarh','Gangashahar'],Ajmer:['Pushkar Road','Adarsh Nagar'],Jaisalmer:['Gadisar','Sam Road'],Barmer:['Station Road','Balotra'],Alwar:['Scheme 10','Shanti Kunj'],Bharatpur:['Kila Area','Keoladeo Road'],Sikar:['Fatehpur Road','Salasar'],Chittorgarh:['Fort Road','Bassi']};
D.forEach(d=>{d.areas=(AREAS[d.n]||[]).slice();d.inv={kits:Math.round(d.beds/4),food:d.pop*1500,water:d.pop*2500,blk:d.pop*500,eq:d.resc*40};d.base={...d.inv}});
const E=[[0,5,135],[0,10,115],[0,8,150],[0,9,185],[0,3,245],[5,1,200],[5,2,270],[5,3,205],[1,4,250],[1,7,215],[1,6,285],[7,6,155],[2,11,115],[3,11,170],[10,4,215],[8,9,95],[5,11,190]];
const BASE=['Jaipur','Jodhpur','Udaipur','Kota','Ajmer','Bikaner'];
const RC={Low:'#6aa84f',Medium:'#e6c229',High:'#e8892b',Critical:'#d03a35'};

const NAV=[['map','Live Map','#5964A8'],['report','Report Incident','#D95C5C'],['pred','Risk Forecast','#8767B7'],['res','Resources','#5487B8'],['resp','Responders','#4E9990'],['shel','Shelters','#D6A34A'],['inv','Inventory','#D9824B'],['mine','My Reports','#D95C5C'],['alerts','Alerts','#D96B68'],['data','Sample Data','#69727C'],['users','Users','#69727C']];
let cur='map',sel=null;
const ALLOW={Admin:['map','report','pred','res','resp','shel','inv','alerts','data','users'],Staff:['map','resp','inv','shel','alerts'],Citizen:['report','mine']},LBL={Admin:'Administrator',Staff:'Field Staff',Citizen:'Citizen'};let lastRef=0;

function vUsers(){const U=[['admin@novair.com','Administrator','Runs the platform: map, predictions, resources, alerts, data and users'],['staff@novair.com','Field Staff','Updates ambulance dispatch status and inventory stock'],['citizen@novair.com','Citizen','Reports incidents and tracks their own reports']];
return `<h2>Users</h2><table><tr><th>Email</th><th>Role</th><th>Access</th></tr>${U.map(u=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td>${u[2]}</td></tr>`).join('')}</table>`}

// ---- models

const softmax=z=>{const m=Math.max(...z),e=z.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b);return e.map(v=>v/s)};
function predict(d,i){ // multinomial logistic regression (hand-set coefficients, reference class = Low)
 const hist=INC.filter(x=>x.d==d.n).length,z=.9*i.sev+.35*i.wl+.012*i.rain+.00008*i.aff+.0004*d.den+.04*Math.max(0,i.temp-35)+.3*hist;
 const a=[0,-1.6,-3.6,-6.2],b=[0,.9,1.55,2.2],lg=a.map((v,k)=>v+b[k]*z),p=softmax(lg),cl=['Low','Medium','High','Critical'],k=p.indexOf(Math.max(...p));
 const mu=Math.exp(.6+.45*i.sev+.45*Math.log(1+i.aff)+.04*i.wl),nb=mu>150,vr=nb?mu+.05*mu*mu:mu,inj=Math.round(mu);
 const free=d.beds*.25,dm={'Ambulances':[Math.ceil(inj/10),d.amb],'Hospital Beds':[Math.ceil(inj*.7),Math.round(free)],'Doctors':[Math.ceil(inj/15),Math.round(d.beds/12)],'Medical Kits':[Math.ceil(inj*2),Math.round(d.beds/2)],'Rescue Teams':[Math.ceil(i.aff/1500),d.resc],'Shelter Places':[Math.ceil(i.aff*.4),Math.round(d.shel*(1-d.occ))],'Food Packets (x100)':[Math.ceil(i.aff*.4/100*3),Math.round(d.pop*3)],'Water (x100 L)':[Math.ceil(i.aff*.4*3/100),Math.round(d.pop*4)]};
 return{lg,p,cl,risk:cl[k],score:+z.toFixed(2),inj,model:nb?'Negative Binomial':'Poisson',mu:+mu.toFixed(2),vr:+vr.toFixed(2),dm}}
function runPrediction(){const g=id=>document.getElementById(id).value,d=D.find(x=>x.n==g('dd')),type=g('ty'),rel=REL[type]||[],ms=document.getElementById('msg');
 const pk=(id,k,def)=>!rel.includes(k)?def:g(id)=='auto'?SENS[k]:+g(id);
 const area=g('ar')=='__o'?g('lc').trim():g('ar'),aff=+g('af');

  const ex=ASSIGN.find(a=>a.type==type&&a.si==o.k&&a.st!='Completed');st.out[type]=(st.out[type]||0)+take;add-=take;
  if(ex)ex.units+=take;else{const r=dijkstra(o.k,t);ASSIGN.push({type,from:st.n,si:o.k,to,units:take,path:r.km?r.path.join(' → '):'Within district',km:r.km,min:r.km?r2(r.km/55*60):10,st:'Dispatched'})}})}
 feed('Now sending '+v+' '+type+' (needed '+f2(DEM.find(r=>r[0]==type)[1])+')');draw()}
function vResp(){if(!DEM.length)return `<h2>Responders</h2><div class="card sub">No active assignments yet. Units appear here as soon as an incident is reported.</div>`;
 const plan=DEM.map(r=>{const type=r[0],need=r[1],sent=ASSIGN.filter(a=>a.type==type&&a.st!='Completed').reduce((q,a)=>q+a.units,0),mx=D.reduce((q,x)=>q+Math.max(0,Math.floor(TOT[type](x)*.7)-(x.out[type]||0)),0)+sent,gap=need-sent,c=gap>0?'#d03a35':'#4E9990';
  return `<div class="card rcard" style="--ac:${c}"><div class="mrow" style="margin:0"><b>${type}</b><span class="chip" style="background:${c}">${gap>0?'Short '+f2(gap):'Covered'}</span></div><div class="mrow"><span>Needed</span><b>${f2(need)}</b></div><div class="mrow" style="align-items:center"><span>Sending</span><input type="number" min="0" max="${mx}" value="${sent}" style="width:90px;margin:0;text-align:right" onchange="sendTo('${type}',this.value)"></div><div style="margin-top:10px">${bar(Math.min(sent,need),need||1,c)}</div><div class="sub" style="margin-top:8px">Up to ${mx} available</div></div>`}).join('');
 const st=k=>`<select style="margin:0;width:auto" onchange="setSt(${k},this.value)">${['Dispatched','En route','On scene','Completed'].map(x=>`<option ${x==ASSIGN[k].st?'selected':''}>${x}</option>`).join('')}</select>`;
 const cs=ASSIGN.map((a,k)=>`<div class="card"><div class="mrow" style="margin:0"><b>${a.type} ×${a.units}</b>${st(k)}</div><div style="margin:14px 0 6px;font-size:16px">${a.from} → ${a.to}</div><div class="sub">${a.path}</div><div class="sub" style="margin-top:10px">${a.by?'Updated by '+a.by+' · '+a.at:'Dispatched by system'}</div><div class="mrow"><span>${(+a.km).toFixed(1)} km</span><span>${f2(a.min)} min</span></div></div>`).join('');
 return `<h2>Responders – ${INC[0].d}</h2><h3 style="margin:0 0 12px">Dispatch plan · set how many you are sending</h3><div class="gauto">${plan}</div><h3 style="margin:8px 0 12px">Routes and status</h3><div class="gauto">${cs}</div>`}
function vAl(){return `<h2>Alerts</h2>`+(AL.length?'<div class="g2c">'+AL.map(a=>{const c=a.lvl=='CRITICAL'?'#d03a35':a.lvl=='HIGH'?'#e8892b':'#d6a34a';return `<div class="card rcard" style="--ac:${c}"><div class="mrow" style="margin:0"><span class="chip" style="background:${c}">${a.lvl}</span><span class="sub">${a.d} · ${a.time}</span></div><h3 style="margin:14px 0 6px">${a.t}</h3><div>${a.m}</div></div>`}).join('')+'</div>':'<div class="card sub">No alerts yet.</div>')}
function addArea(i){const e=document.getElementById('a_'+i),v=e.value.trim();if(v&&!D[i].areas.includes(v)){D[i].areas.push(v);draw()}}
function vData(){const rows=D.map((d,i)=>`<tr><td>${d.n}</td>${['pop','den','beds','amb','pol','fire','resc','shel'].map(k=>`<td>${role=='Admin'?`<input style="width:70px;margin:0;padding:3px" value="${d[k]}" onchange="D[${i}].${k}=+this.value">`:d[k]}</td>`).join('')}<td style="min-width:220px">${d.areas.join(', ')||'–'}${role=='Admin'?`<div style="display:flex;gap:4px;margin-top:4px"><input id="a_${i}" placeholder="New area" style="margin:0;padding:3px"><button class="alt" onclick="addArea(${i})">Add</button></div>`:''}</td></tr>`).join('');
 return `<h2>Sample Data</h2><table><tr><th>District</th><th>Pop (lakh)</th><th>Density</th><th>Beds</th><th>Ambulances</th><th>Police</th><th>Fire</th><th>Rescue</th><th>Shelter cap.</th><th>Areas</th></tr>${rows}</table>`}
</script></body></html>
